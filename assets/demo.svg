  <text x="24" y="58" xml:space="preserve"><tspan fill="#e6edf3">$ python -m conferencia</tspan></text>
<text x="24" y="79" xml:space="preserve"><tspan fill="#7ee787">LANÇAR   </tspan><tspan fill="#e6edf3"> nota 2026001845  Prestadora Demonstração Alfa        R$ 12.000,00</tspan></text>
