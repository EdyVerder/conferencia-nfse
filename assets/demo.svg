<text x="24" y="121" xml:space="preserve"><tspan fill="#7ee787">LANÇAR   </tspan><tspan fill="#e6edf3"> nota 418         Construtora Demonstração Beta       R$ 48.500,00</tspan></text>
<text x="24" y="142" xml:space="preserve"><tspan fill="#7d8590">          saida/pareceres/parecer_418.pdf</tspan></text>
<text x="24" y="163" xml:space="preserve"><tspan fill="#ff7b72">DEVOLVER </tspan><tspan fill="#e6edf3"> nota 9027        Serviços Gerais Demonstração Gama    R$ 8.400,00</tspan></text>
<text x="24" y="184" xml:space="preserve"><tspan fill="#e6edf3">          </tspan><tspan fill="#ff7b72">↳ ISS retido R$ 252,00; o esperado para o serviço 07.10 é R$ 420,00.</tspan></text>
<text x="24" y="205" xml:space="preserve"><tspan fill="#7d8590">          saida/pareceres/parecer_9027.pdf</tspan></text>
<text x="24" y="226" xml:space="preserve"><tspan fill="#ff7b72">DEVOLVER </tspan><tspan fill="#e6edf3"> nota 77          Tecnologia Demonstração Delta        R$ 3.200,00</tspan></text>
<text x="24" y="247" xml:space="preserve"><tspan fill="#e6edf3">          </tspan><tspan fill="#ff7b72">↳ O prestador da nota (75.287.517/0001-02) não é o fornecedor do lançamento (75.794.038/0001-82).</tspan></text>
<text x="24" y="268" xml:space="preserve"><tspan fill="#7d8590">          saida/pareceres/parecer_77.pdf</tspan></text>
<text x="24" y="289" xml:space="preserve"><tspan fill="#7ee787">LANÇAR   </tspan><tspan fill="#e6edf3"> nota 2026001790  Prestadora Demonstração Alfa           R$ 450,00</tspan></text>
<text x="24" y="310" xml:space="preserve"><tspan fill="#e6edf3">          </tspan><tspan fill="#f2cc60">↳ Nota emitida em 10/2026, lançada na competência 11/2026.</tspan></text>
<text x="24" y="331" xml:space="preserve"><tspan fill="#7d8590">          saida/pareceres/parecer_2026001790.pdf</tspan></text>
<text x="24" y="352" xml:space="preserve"><tspan fill="#ff7b72">DEVOLVER </tspan><tspan fill="#e6edf3"> nota 421         Construtora Demonstração Beta       R$ 15.000,00</tspan></text>
<text x="24" y="373" xml:space="preserve"><tspan fill="#e6edf3">          </tspan><tspan fill="#ff7b72">↳ O líquido lançado (R$ 13.350,00) não fecha com a nota menos as retenções (R$ 12.900,00).</tspan></text>
<text x="24" y="394" xml:space="preserve"><tspan fill="#7d8590">          saida/pareceres/parecer_421.pdf</tspan></text>
<text x="24" y="415" xml:space="preserve"><tspan fill="#ff7b72">DEVOLVER </tspan><tspan fill="#e6edf3"> nota 9031        Serviços Gerais Demonstração Gama    R$ 1.000,00</tspan></text>
<text x="24" y="436" xml:space="preserve"><tspan fill="#e6edf3">          </tspan><tspan fill="#ff7b72">↳ A nota 9031 está cancelada na prefeitura.</tspan></text>
